services:
  postgres:
    image: postgres:18-alpine
    container_name: chainlance-postgres

    environment:
      POSTGRES_DB: chainlance
      POSTGRES_USER: chainlance
      POSTGRES_PASSWORD: chainlance_local

    ports:
      - '5432:5432'

    volumes:
      - chainlance_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U chainlance -d chainlance',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chainlance_postgres_data: